[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crt"
version = "0.0.1"
description = "Candle Range Theory scanner + paper trading terminal for crypto (Bybit futures)"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "websockets>=12",
    "rich>=13.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "smartmoneyconcepts>=0.0.25",
    "plotly>=5.20",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
crt = "crt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
